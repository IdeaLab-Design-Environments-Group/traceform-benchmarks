[project]
name = "traceformroutebench"
version = "0.1.0"
description = "Does signed fold geometry, carried from 3D unfolding into circuit routing, reduce mechanically risky crease crossings?"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
